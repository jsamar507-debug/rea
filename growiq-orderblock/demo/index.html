<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrowIQ Order Block Board</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#14181f; --mute:#6b7280; --line:#e5e7eb;
          --bull:#0f9d58; --bear:#d93025; --zone:rgba(66,133,244,.18); --amber:#f29900; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0b0e13; --card:#141922; --ink:#e8eaed; --mute:#9aa0a6; --line:#262d38; } }
  * { box-sizing:border-box } body { margin:0; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--ink) }
  header { padding:16px; display:flex; flex-wrap:wrap; gap:12px; align-items:baseline }
  h1 { font-size:18px; margin:0 } .mute { color:var(--mute) }
  .breadth { display:flex; gap:8px; flex-wrap:wrap } .pill { padding:2px 10px; border-radius:99px; background:var(--card); border:1px solid var(--line) }
  main { display:grid; gap:16px; padding:0 16px 24px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)) }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px }
  h2 { font-size:15px; margin:0 0 8px } table { width:100%; border-collapse:collapse }
  td { padding:6px 4px; border-top:1px solid var(--line) } tr { cursor:pointer } tr:hover td { background:var(--bg) }
  .up { color:var(--bull) } .down { color:var(--bear) } .tag { font-size:11px; padding:1px 6px; border-radius:4px; border:1px solid currentColor }
  .event { color:var(--amber) }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:min(720px,calc(100vw - 32px)); padding:16px }
  dialog::backdrop { background:rgba(0,0,0,.4) } canvas { width:100%; height:300px; display:block }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:6px 12px; margin:8px 0 }
  .grid b { display:block; font-size:12px; color:var(--mute); font-weight:500 }
  footer { padding:0 16px 24px; font-size:12px; color:var(--mute) }
</style>
</head>
<body>
<header>
  <h1>Order Block Board</h1><span class="mute">GrowIQ Capital · demo on synthetic data</span>
  <div class="breadth" id="breadth"></div>
</header>
<main>
  <section><h2 class="up">Bullish · strongest first</h2><table id="bullish"></table></section>
  <section><h2 class="down">Bearish · strongest first</h2><table id="bearish"></table></section>
</main>
<footer>Market data analytics for education only. Not investment advice or a recommendation to buy or sell any security. F&amp;O trading involves substantial risk.</footer>
<dialog id="pop"><div id="popBody"></div><form method="dialog"><button>Close</button></form></dialog>

<script type="module">
import { buildBoard } from '../src/orderblock.js';
import { sampleUniverse } from '../src/sample-data.js';

const universe = sampleUniverse(7);
const bySymbol = Object.fromEntries(universe.map((s) => [s.symbol, s]));
const board = buildBoard(universe);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const b = board.breadth;
document.getElementById('breadth').innerHTML =
  `<span class="pill up">${b.bullish} bullish</span><span class="pill down">${b.bearish} bearish</span>` +
  `<span class="pill">${b.choppy} choppy</span><span class="pill">Leading: ${b.leadingSector}</span>` +
  `<span class="pill">Lagging: ${b.laggingSector}</span>`;

for (const side of ['bullish', 'bearish']) {
  document.getElementById(side).innerHTML = board[side].map((r) => `
    <tr data-s="${r.symbol}" data-side="${side}">
      <td>${String(r.rank).padStart(2, '0')}</td>
      <td><strong>${r.symbol}</strong><br><span class="mute">${r.sector}</span></td>
      <td class="${r.changePct >= 0 ? 'up' : 'down'}">${r.changePct >= 0 ? '+' : ''}${r.changePct}%</td>
      <td>${r.eventRisk ? '<span class="tag event">event risk</span>' : r.pick ? '<span class="tag">pick</span>' : ''}</td>
    </tr>`).join('');
}

document.querySelectorAll('tr[data-s]').forEach((tr) => tr.addEventListener('click', () => {
  const side = tr.dataset.side;
  const row = board[side].find((r) => r.symbol === tr.dataset.s);
  openPopup(row, side);
}));

function openPopup(row, side) {
  const s = row.setup;
  const L = s?.levels;
  const bull = side === 'bullish';
  const [stopK, t1K, t2K] = bull ? ['S1', 'R1', 'R2'] : ['R1', 'S1', 'S2'];
  const body = !s?.block
    ? `<p class="mute">${row.eventRisk ? 'Event risk: no levels drawn.' : 'No valid order block on finished candles yet.'}</p>`
    : `<div class="grid">
        <div><b>Rank</b>p${row.percentile} · #${row.rank}/${row.sideCount}</div>
        <div><b>Rule</b>${row.rule}</div>
        <div><b>Order block</b>${s.block.low} – ${s.block.high}</div>
        <div><b>Z</b>${L.Z}</div>
        <div><b>${stopK} (wrong if closed beyond)</b>${L[stopK]}</div>
        <div><b>${t1K}</b>${L[t1K].price} <span class="mute">${L[t1K].source}</span></div>
        <div><b>${t2K}</b>${L[t2K].price} <span class="mute">${L[t2K].source}</span></div>
        <div><b>R:R at Z</b>1 : ${s.rr}</div>
        <div><b>R:R at price</b>${s.rrFromPrice == null ? '—' : '1 : ' + s.rrFromPrice}</div>
        <div><b>VWAP</b>${s.vwap} ${s.vwapAligned ? '✓' : '✗'}</div>
      </div>`;
  document.getElementById('popBody').innerHTML =
    `<h2>${row.symbol} <span class="mute">${row.sector}</span> ${row.last.toFixed(2)}
       <span class="${row.changePct >= 0 ? 'up' : 'down'}">${row.changePct}%</span></h2>${body}<canvas id="cv"></canvas>`;
  document.getElementById('pop').showModal();
  drawChart(document.getElementById('cv'), bySymbol[row.symbol].candles, s, side);
}

function drawChart(cv, candles, s, side) {
  const dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const L = s?.levels;
  const extra = L ? [L.Z, ...Object.values(L).flatMap((v) => (typeof v === 'number' ? [v] : v?.price ? [v.price] : []))] : [];
  const hi = Math.max(...candles.map((k) => k.h), ...extra), lo = Math.min(...candles.map((k) => k.l), ...extra);
  const pad = (hi - lo) * 0.05, y = (p) => H - 16 - ((p - lo + pad) / (hi - lo + 2 * pad)) * (H - 24);
  const cw = (W - 60) / candles.length, x = (i) => 4 + i * cw + cw / 2;

  if (s?.block) {
    g.fillStyle = css('--zone');
    g.fillRect(x(s.block.blockIndex) - cw / 2, y(s.block.high), W - 60 - x(s.block.blockIndex) + cw / 2, y(s.block.low) - y(s.block.high));
  }
  candles.forEach((k, i) => {
    g.strokeStyle = g.fillStyle = k.c >= k.o ? css('--bull') : css('--bear');
    g.beginPath(); g.moveTo(x(i), y(k.h)); g.lineTo(x(i), y(k.l)); g.stroke();
    g.fillRect(x(i) - cw * 0.35, y(Math.max(k.o, k.c)), cw * 0.7, Math.max(1, Math.abs(y(k.o) - y(k.c))));
  });
  const line = (p, label, color, dash = []) => {
    g.setLineDash(dash); g.strokeStyle = color; g.beginPath(); g.moveTo(0, y(p)); g.lineTo(W - 60, y(p)); g.stroke();
    g.setLineDash([]); g.fillStyle = color; g.font = '11px system-ui'; g.fillText(`${label} ${p}`, W - 58, y(p) + 4);
  };
  if (s?.vwap) line(s.vwap, 'VWAP', css('--mute'), [4, 4]);
  if (L) {
    const bull = side === 'bullish';
    line(L.Z, 'Z', css('--ink'));
    line(L[bull ? 'S1' : 'R1'], bull ? 'S1' : 'R1', css('--bear'));
    const [a, b2] = bull ? ['R1', 'R2'] : ['S1', 'S2'];
    line(L[a].price, a, css('--bull')); line(L[b2].price, b2, css('--bull'));
    L.onTheWay.forEach((o) => line(o.price, '', css('--amber'), [2, 3]));
  }
}
</script>
</body>
</html>
